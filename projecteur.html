<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <title>Loup-Garou - Écran Projecteur</title>
  <style>
    @font-face {
      font-family: 'Wolf Brothers';
      src: url('wolfbrothers.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #0b0d14;
      background-image: radial-gradient(circle at center, rgba(37, 99, 235, 0.15) 0%, rgba(11, 13, 20, 0.95) 100%),
                        url('https://ifjiysdhxmidiswcsiuq.supabase.co/storage/v1/object/public/assets/assets/images/fond-village.jpg');
      background-size: cover; background-position: center;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #e2e8f0; overflow: hidden; position: relative;
    }

    #player { width: 100%; height: 100%; pointer-events: none; }

    #overlay-video {
      position: absolute;
      display: none; z-index: 10;
    }
    
    /* Format appel personnage classique */
    #overlay-video.center {
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 50%; height: auto; aspect-ratio: 1728 / 918;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      border: 2px solid rgba(255,255,255,0.3); border-radius: 8px;
      background: #000; object-fit: contain;
    }

    /* Format PLEIN ÉCRAN sans recadrage (ex: Maire, Morts) */
    #overlay-video.fullscreen {
      top: 0; left: 0; transform: none;
      width: 100%; height: 100%; max-height: none;
      border: none; border-radius: 0; box-shadow: none;
      background: #000; object-fit: contain;
    }

    /* Texte d'annonce des morts */
    #death-overlay {
      position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Wolf Brothers', sans-serif;
      font-size: 5rem; color: #dc2626;
      text-shadow: 0 4px 25px rgba(0,0,0,1), 0 0 50px #7f1d1d;
      text-align: center; z-index: 20;
      display: none; pointer-events: none;
      width: 100%;
    }

    /* Styles pour la salle d'attente (inchangés) */
    #waiting-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .projector-title { font-family: 'Wolf Brothers', sans-serif; font-size: 3rem; color: #f4dcdc; margin-bottom: 30px; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
    .blood-card { background: linear-gradient(180deg, rgba(42, 9, 12, 0.92), rgba(17, 10, 16, 0.95)); border: 1px solid rgba(127, 29, 29, 0.75); border-radius: 8px; padding: 24px; }
    .lobby-container { display: flex; gap: 50px; max-width: 1100px; width: 90%; }
    .qr-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .qr-code-img { background: #fff; padding: 14px; border-radius: 12px; margin-bottom: 15px; }
    .room-code-badge { font-family: 'Wolf Brothers', sans-serif; font-size: 2.2rem; color: #ef4444; }
    .players-box { flex: 1.2; display: flex; flex-direction: column; }
    .players-box h3 { font-family: 'Wolf Brothers', sans-serif; font-size: 1.8rem; color: #f4dcdc; border-bottom: 2px solid #7f1d1d; padding-bottom: 8px; }
    .players-list { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .players-list li { background: rgba(80, 10, 14, 0.7); border: 1px solid rgba(185, 28, 28, 0.6); border-radius: 4px; padding: 8px; font-family: 'Wolf Brothers', sans-serif; font-size: 1.2rem; color: #fca5a5; }
  </style>
</head>
<body>

  <div id="waiting-screen">
    <div class="projector-title">🌐 Rejoindre la Partie</div>
    <div class="lobby-container">
      <div class="blood-card qr-box">
        <div id="qr-code-target" class="qr-code-img"></div>
        <p>Scannez pour rejoindre</p>
        <div class="room-code-badge">CODE : <span id="room-code-text">----</span></div>
      </div>
      <div class="blood-card players-box">
        <h3>👥 Joueurs présents (<span id="player-count">0</span>)</h3>
        <ul id="player-list-target" class="players-list"></ul>
      </div>
    </div>
  </div>

  <div id="player"></div>
  <video id="overlay-video" playsinline></video>
  <div id="death-overlay"></div>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let ytPlayer = null;
    let ytReady = false;
    let fadeInterval = null;
    let currentDeathMode = null;
    let currentDeathNames = [];

    const overlayVideo = document.getElementById('overlay-video');
    const deathText = document.getElementById('death-overlay');

    function setOverlayMode(mode) {
      overlayVideo.className = '';
      if (mode === 'center') overlayVideo.classList.add('center');
      else if (mode === 'fullscreen') overlayVideo.classList.add('fullscreen');
    }

    function hideOverlay() {
      overlayVideo.pause();
      overlayVideo.style.display = 'none';
      overlayVideo.removeAttribute('src');
      deathText.style.display = 'none';
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1 },
        events: {
          onReady: () => { ytReady = true; if (window.opener) window.opener.postMessage({ action: 'projectorReady' }, '*'); },
          onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) { ytPlayer.seekTo(0); ytPlayer.playVideo(); } }
        }
      });
    }

    function fadeVolumeTo(target01, durationMs = 600) {
      if (!ytReady) return;
      clearInterval(fadeInterval);
      const startVolume = ytPlayer.getVolume();
      const targetVolume = target01 * 100;
      const steps = 30;
      let currentStep = 0;
      fadeInterval = setInterval(() => {
        currentStep++;
        ytPlayer.setVolume(startVolume + ((targetVolume - startVolume) * (currentStep / steps)));
        if (currentStep >= steps) clearInterval(fadeInterval);
      }, durationMs / steps);
    }

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data) return;

      if (data.action === 'playYTVideo') {
        document.getElementById('waiting-screen').style.display = 'none';
        hideOverlay();
        ytPlayer.loadVideoById(data.videoId);
      } 
      else if (data.action === 'playOverlayVideo') {
        document.getElementById('waiting-screen').style.display = 'none';
        setOverlayMode(data.mode);
        overlayVideo.src = data.url;
        overlayVideo.loop = true;
        overlayVideo.style.display = 'block';
        overlayVideo.play().catch(e => console.error(e));
      }
      else if (data.action === 'playDeath') {
        document.getElementById('waiting-screen').style.display = 'none';
        setOverlayMode('fullscreen');
        overlayVideo.src = data.url;
        overlayVideo.loop = false;
        overlayVideo.style.display = 'block';
        
        currentDeathMode = data.mode;
        currentDeathNames = data.names;
        
        // Loups-garous: apparition du nom direct
        if (currentDeathMode === 'wolves') {
          deathText.innerHTML = currentDeathNames.join('<br>');
          deathText.style.display = 'block';
        } else {
          deathText.style.display = 'none';
        }
        overlayVideo.play().catch(e => console.error(e));
      }
      else if (data.action === 'stopOverlayVideo' || data.action === 'stop') {
        hideOverlay();
      }
      else if (data.action === 'setVolume') {
        fadeVolumeTo(data.volume, data.duration);
      }
    });

    // Gestion temporelle pour l'élimination de fin de vidéo (Vote)
    overlayVideo.addEventListener('timeupdate', () => {
      if (currentDeathMode === 'vote' && overlayVideo.duration && overlayVideo.currentTime >= overlayVideo.duration - 1.5) {
        deathText.innerHTML = currentDeathNames.join('<br>');
        deathText.style.display = 'block';
        currentDeathMode = null; // Affiché !
      }
    });

    // Maintien final 4 secondes pour bien lire les noms puis fermeture
    overlayVideo.addEventListener('ended', () => {
      if (currentDeathNames.length > 0) {
        setTimeout(() => { hideOverlay(); currentDeathNames = []; }, 4000);
      }
    });
  </script>
</body>
</html>
