<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Test des médias locaux</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0d14; color: #e2e8f0; padding: 20px; max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.4rem; }
    #summary { padding: 12px 16px; border-radius: 8px; background: #1e293b; margin-bottom: 16px; line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    td { padding: 6px 8px; border-bottom: 1px solid #1e293b; word-break: break-all; }
    td:first-child { width: 90px; white-space: nowrap; }
    .ok { color: #4ade80; } .ko { color: #f87171; } .wait { color: #94a3b8; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <h1>Test des médias locaux</h1>
  <div id="summary">Test en cours…</div>
  <table id="rows"></table>

  <script src="assets/manifest.js"></script>
  <script src="assets.js"></script>
  <script>
    const TIMEOUT = 10000;
    const rows = document.getElementById('rows');
    let total = 0, done = 0, failed = [];

    function check(kind, url) {
      return new Promise((resolve) => {
        let el;
        const finish = (ok) => { clearTimeout(t); resolve(ok); };
        const t = setTimeout(() => finish(false), TIMEOUT);
        if (kind === 'images') {
          el = new Image();
          el.onload = () => finish(true);
          el.onerror = () => finish(false);
        } else {
          el = document.createElement((kind === 'audio' || kind === 'music') ? 'audio' : 'video');
          el.preload = 'metadata';
          el.onloadedmetadata = () => finish(true);
          el.onerror = () => finish(false);
        }
        el.src = url;
      });
    }

    async function run() {
      const jobs = [];
      for (const kind of Object.keys(ASSETS)) {
        for (const [name, url] of Object.entries(ASSETS[kind])) {
          total++;
          const tr = document.createElement('tr');
          tr.innerHTML = `<td class="wait">⏳ ${kind}</td><td></td>`;
          tr.children[1].innerHTML = `${name}<br><a href="${url}" target="_blank" rel="noopener">${url}</a>`;
          rows.appendChild(tr);
          jobs.push(check(kind, url).then((ok) => {
            done++;
            tr.children[0].className = ok ? 'ok' : 'ko';
            tr.children[0].textContent = (ok ? '✅ ' : '❌ ') + kind;
            if (!ok) failed.push(`${kind}/${name}`);
          }));
        }
      }
      await Promise.all(jobs);
      const s = document.getElementById('summary');
      if (failed.length === 0) {
        s.innerHTML = `✅ Les ${total} fichiers sont accessibles.`;
      } else if (failed.length === total) {
        s.innerHTML = `❌ <strong>Aucun fichier accessible.</strong> Le dossier <code>assets/</code> est vide ou le site n'est pas servi par le serveur local : lancez <code>npm run fetch-assets</code>.`;
      } else {
        s.innerHTML = `⚠️ ${total - failed.length}/${total} accessibles. Fichiers manquants ou mal nommés (${failed.length}) : <br>` +
          failed.map((f) => `• ${f}`).join('<br>') +
          `<br><br>Copiez-les dans <code>assets/</code> (ou lancez <code>npm run fetch-assets</code>), ou remplacez-les depuis le Back-Office.`;
      }
    }
    // Police des noms : le fichier .ttf est un secours (la police est aussi intégrée dans style.css)
    async function checkFont() {
      const tr = document.createElement('tr');
      let ok = false;
      try {
        const ff = new FontFace('AngelWishFichier', "url('Angel_wish.ttf')");
        await ff.load();
        ok = true;
      } catch (e) { ok = false; }
      tr.innerHTML = `<td class="${ok ? 'ok' : 'wait'}">${ok ? '✅' : 'ℹ️'} police</td><td>Angel_wish.ttf (secours)<br>` +
        (ok ? 'Fichier présent à la racine du site.' : "Fichier absent ou illisible : sans conséquence, la police est intégrée dans <code>style.css</code>.") + '</td>';
      document.getElementById('rows').appendChild(tr);
    }
    checkFont();
    run();
  </script>
</body>
</html>
